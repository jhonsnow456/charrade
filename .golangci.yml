run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - dupl
    - errname
    - exhaustive
    - exportloopref
    - gochecknoinits
    - gofmt
    - goimports
    - gomodguard
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - whitespace

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: error-return
      - name: error-strings
      - name: increment-decrement
      - name: var-naming
      - name: package-comments
        disabled: true
      - name: exported
        arguments:
          - 'checkPrivateReceivers'
  goimports:
    local-prefixes: github.com/hey-amanthakur/charrade

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues-per-linter: 5
